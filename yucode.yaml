name: yucode
description: Minimal, coral-accented theme inspired by Claude Code's terminal aesthetic

colors:
  banner_border: "#D97757"
  banner_title: "#D97757"
  banner_accent: "#E8A87C"
  banner_dim: "#6B6B6B"
  banner_text: "#D4D4D4"

  ui_accent: "#D97757"
  ui_label: "#8C8C8C"
  ui_ok: "#87C38F"
  ui_error: "#E5707E"
  ui_warn: "#D9A066"

  prompt: "#D4D4D4"
  input_rule: "#4A4A4A"

  response_border: "#4A4A4A"
  response_text: "#D4D4D4"

  session_label: "#D97757"
  session_border: "#3A3A3A"

  reasoning_border: "#4A4A4A"
